schema_version: 1
name: glusterfs.volume.status.read
status: published
domain: glusterfs
resource_type: volume
operation: read
risk: low
backend:
    adapter: http
    method: GET
    path: /api/glusterfs/{cluster}/volumes/{volume}/status
    timeout_ms: 3000
    base_url: http://127.0.0.1:19090
input_schema:
    cluster:
        type: string
        required: true
    environment:
        type: string
        required: true
    volume:
        type: string
        required: true
output:
    kind: observation
    severity_path: $.status
    summary_template: Volume {volume} has {online_bricks} online bricks and {heal_backlog} heal backlog
    fields:
        heal_backlog: $.data.heal_backlog
        offline_bricks: $.data.offline_bricks
        online_bricks: $.data.online_bricks
governance:
    requires_action_plan: false
    requires_approval: false
    precheck_tools: []
    rollback:
        strategy: ""
        source: ""
auth:
    roles:
        - viewer
        - operator
        - admin
    environment_scoped: true
ai:
    description: Read GlusterFS volume status from the demo middleware backend.
    examples:
        - 查询 prod g1 data volume 的 glusterfs 状态
