schema_version: 1
name: topic.retention.set
status: published
domain: kafka
resource_type: topic
operation: write
risk: medium
backend:
    adapter: http
    method: POST
    path: /api/kafka/default/topics/{topic}/retention
    timeout_ms: 5000
    base_url: http://127.0.0.1:19090
input_schema:
    environment:
        type: string
        required: true
        description: 目标环境
        enum: [prod, staging, dev]
        examples: [prod]
    topic:
        type: string
        required: true
        description: 要调整保留期的 Kafka topic 名
        examples: [orders, payments]
    retention_hours:
        type: integer
        required: true
        min: 1
        max: 8760
        description: 保留时长（小时）
        examples: [72, 168]
output:
    kind: confirmation
    severity_path: ""
    summary_template: Retention for topic {topic} set to {retention_hours}h
    fields: {}
governance:
    requires_action_plan: true
    requires_approval: true
    precheck_tools:
        - kafka.topic.retention.read
    rollback:
        strategy: reset_to_previous
        source: previous_value
auth:
    roles:
        - operator
        - admin
    environment_scoped: true
ai:
    description: Set Kafka topic retention hours via the demo middleware backend.
    examples:
        - set prod kafka orders topic retention to 72 hours
        - 配置 prod kafka orders topic 保留 48 小时
