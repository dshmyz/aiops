schema_version: 1
name: kafka.topic.retention.write
status: published
domain: kafka
resource_type: topic
operation: write
risk: medium
backend:
    adapter: http
    method: POST
    path: /api/kafka/{cluster}/topics/{topic}/retention
    timeout_ms: 5000
    base_url: http://127.0.0.1:19090
input_schema:
    environment:
        type: string
        required: true
    cluster:
        type: string
        required: true
    topic:
        type: string
        required: true
    retention_hours:
        type: integer
        required: true
        min: 1
        max: 8760
output:
    kind: confirmation
    severity_path: $.status
    summary_template: Retention for topic {topic} set to {retention_hours}h
    fields: {}
governance:
    requires_action_plan: true
    requires_approval: true
    precheck_tools:
        - kafka.topic.retention.read
    rollback:
        strategy: reset_to_previous
        source: previous_value
auth:
    roles:
        - operator
        - admin
    environment_scoped: true
ai:
    description: Set Kafka topic retention hours
    examples:
        - set prod kafka orders topic retention to 72 hours
        - 配置 prod kafka orders topic 保留 48 小时
verify:
    read_capability: kafka.topic.retention.read
    input_mapping:
        cluster: '{cluster}'
        topic: '{topic}'
        environment: '{environment}'
    timeout_ms: 3000
