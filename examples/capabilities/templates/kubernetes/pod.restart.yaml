schema_version: 1
name: k8s.pod.restart
status: draft
domain: kubernetes
resource_type: pod
operation: write
risk: medium

backend:
    adapter: http
    method: DELETE
    path: /api/v1/namespaces/{namespace}/pods/{pod_name}
    timeout_ms: 10000
    base_url: https://kubernetes.default.svc
    # In real deployment, use a K8s client or MCP server instead of raw HTTP

input_schema:
    namespace:
        type: string
        required: true
        description: Kubernetes namespace
    pod_name:
        type: string
        required: true
        description: Pod name to restart
    environment:
        type: string
        required: true
        description: Target environment (prod/staging/dev)

output:
    kind: action
    severity_path: $.status
    summary_template: "Pod {pod_name} in namespace {namespace} restarted"
    fields:
        deletion_timestamp: $.metadata.deletionTimestamp
        status: $.status.phase

governance:
    requires_action_plan: true
    requires_approval: true  # Medium risk: require approval in prod
    precheck_tools:
        - k8s.pod.status.read  # Check pod exists and is running before restart
    rollback:
        strategy: manual
        source: "If pod fails to restart, check logs with k8s.logs.tail"

auth:
    roles:
        - operator
        - admin
    environment_scoped: true

ai:
    description: |
        Restart a Kubernetes pod by deleting it (triggers ReplicaSet/Deployment recreation).
        Use when pod is stuck, OOMKilled, or needs config reload.

        **Caution**: This causes brief downtime. Verify the pod is part of a Deployment/ReplicaSet
        before restarting to ensure it will be recreated.

    examples:
        - 重启 prod namespace default 下的 pod api-server-5d7c8f9b-x7k2m
        - restart pod nginx-ingress-controller in namespace ingress-nginx, environment staging
        - 把 dev 环境 kube-system 命名空间的 coredns-7d9f8c-abc12 pod 重启一下

    safety_notes:
        - Only works for pods managed by Deployment/ReplicaSet/StatefulSet
        - Standalone pods will not be recreated after deletion
        - Check pod readiness before marking the operation as successful
