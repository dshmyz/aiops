name: Capability Validation

on:
  pull_request:
    paths:
      - 'capabilities/**/*.yaml'
      - 'capabilities/**/*.yml'
      - 'examples/capabilities/**/*.yaml'
      - 'examples/capabilities/**/*.yml'
  push:
    branches:
      - main
    paths:
      - 'capabilities/**/*.yaml'
      - 'capabilities/**/*.yml'

jobs:
  validate:
    name: Validate Capability Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: |
          go mod download
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Find changed capability files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=ACM \
              ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | \
              grep -E '\.ya?ml$' | grep -E 'capabilit' || true)
          else
            files=$(git diff --name-only --diff-filter=ACM \
              ${{ github.event.before }} ${{ github.sha }} | \
              grep -E '\.ya?ml$' | grep -E 'capabilit' || true)
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate YAML syntax
        if: steps.changed-files.outputs.files != ''
        run: |
          go run ./cmd/capability-validator validate-syntax \
            --files "${{ steps.changed-files.outputs.files }}"

      - name: Validate capability schema
        if: steps.changed-files.outputs.files != ''
        run: |
          go run ./cmd/capability-validator validate-schema \
            --files "${{ steps.changed-files.outputs.files }}"

      - name: Check required fields
        if: steps.changed-files.outputs.files != ''
        run: |
          go run ./cmd/capability-validator check-required \
            --files "${{ steps.changed-files.outputs.files }}"

      - name: Security scan (secrets detection)
        if: steps.changed-files.outputs.files != ''
        run: |
          go run ./cmd/capability-validator scan-secrets \
            --files "${{ steps.changed-files.outputs.files }}"

      - name: Dry-run execution test
        if: steps.changed-files.outputs.files != ''
        run: |
          go run ./cmd/capability-validator dry-run \
            --files "${{ steps.changed-files.outputs.files }}"

      - name: Generate validation report
        if: always() && steps.changed-files.outputs.files != ''
        run: |
          go run ./cmd/capability-validator report \
            --files "${{ steps.changed-files.outputs.files }}" \
            --output validation-report.md

      - name: Post validation report as PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'validation-report.md';

            if (!fs.existsSync(reportPath)) {
              console.log('No validation report found');
              return;
            }

            const report = fs.readFileSync(reportPath, 'utf8');

            const comment = `## 🔍 Capability Validation Report

${report}

---
*Generated by [Capability Validation CI](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Capability Validation Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            validation-report.md
            validation-*.json
