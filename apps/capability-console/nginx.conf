# 反代到 compose 网络里的 copilot-api 服务
upstream copilot_api {
    server copilot-api:18080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 静态资源带 hash，可长缓存；index.html 不缓存以便发布后即时更新
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA：未知路径回退到 index.html（无路由库，但保留 fallback 以防未来用 hash 路由之外的形式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代到 copilot-api，仅透传；SPA 自己带 Authorization，不做任何改写
    location /v1/ {
        proxy_pass http://copilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;   # SSE 流式对话需要更长读超时
        proxy_buffering off;       # 关闭缓冲以便 SSE 实时推送
    }
}
